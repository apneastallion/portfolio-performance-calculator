# Cloudflare Pages project settings — the source of truth for the Git-integrated build.
# Without these two keys the integration published the repository root, which served the
# uncompiled source index.html (it imports /src/main.tsx) and rendered a blank page.
# `dist/` is gitignored, so the build command has to regenerate it on every deploy:
# Vite writes the SPA, then scripts/build-worker.mjs writes dist/_worker.js.
name = "portfolio-performance-calculator"
pages_build_output_dir = "./dist"
compatibility_date = "2026-10-21"

[build]
command = "npm run build"
